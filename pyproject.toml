[project]
name = "statgarden"
version = "0.1.0"
description = "NBA stats pivot builder: ingestion, warehouse and API"
requires-python = ">=3.13"
dependencies = [
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
    "duckdb==2.0.0",
    "fastapi==0.165.0",
    "nba-api==1.12.0",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
