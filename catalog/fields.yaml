  # ── Clutch and garbage time (play-by-play) ─────────────────────────────────
  - id: had_clutch
    label: Close finish
    short: Clutch game
    group: Clutch
    kind: dimension
    type: bucket
    bins: [Clutch game, No clutch time]
    expr: "CASE WHEN had_clutch THEN 'Clutch game' ELSE 'No clutch time' END"
    source: pbp
    datasets: [player_game, team_game]
    description: Whether the game had clutch time (last 5 minutes of the 4th or OT, score within 5). Blank play-by-play counts as no.

  - id: had_garbage
    label: Garbage time in game
    short: Garbage
    group: Clutch
    kind: dimension
    type: bucket
    bins: [Had garbage time, No garbage time]
    expr: "CASE WHEN had_garbage THEN 'Had garbage time' ELSE 'No garbage time' END"
    source: pbp
    datasets: [player_game, team_game]
    description: Whether the 4th quarter hit a blowout (25+ with 9-12 min left, 20+ with 6-9, 15+ under 6). A rough rule, not an official one.

