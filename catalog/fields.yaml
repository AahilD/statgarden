# StatGarden field catalog (draft v0, 2026-11-19)
#
# The builder, lib/sql.ts and the API all read this file. A PivotSpec may only
# reference field ids that appear here; nothing user-typed goes into SQL.
#
# Field keys
#   id          stable id used in PivotSpecs and URLs (never rename once shared)
#   label       full name shown in the field list
#   short       column header / chip text
#   group       section in the field list
#   kind        dimension | measure
#   type        dimensions: text | int | date | bool | bucket
#   expr        SQL over the mart row (fact_player_game joined to dims)
#   bins        bucket dimensions: ordered labels; expr must return one of them
#   agg         measures: sum | count | ratio | weighted_avg
#   requires    ratio measures: base measures summed first, then `formula` is
#               applied after grouping. Needed because DuckDB PIVOT ... USING
#               allows one aggregate per expression, and because averaging
#               per-game percentages gives the wrong answer.
#   weight      weighted_avg measures: the measure used as the weight (minutes)
#   modes       which value modes the builder offers: total | per_game | per_36
#   default_mode
#   format      d3-format string (same syntax Vega-Lite uses)
#   higher_is_better  for percentile chips and colour scales
#   source      where the data comes from today:
#                 gamelog   LeagueGameLog (loaded now)
#                 derived   computed in transform SQL from gamelog + dim_game
#                 dim       dim_player / dim_team (seed job, not built yet)
#                 box_v3    BoxScoreTraditionalV3 / AdvancedV3 (backfill, not built yet)

datasets:
  - id: player_game
    label: Player games
    grain: one row per player per game
    table: fact_player_game
    default:
      rows: [player]
      values: [pts]
      filters:
        - { field: season, op: in, value: ["2025-26"] }
        - { field: season_type, op: in, value: ["Regular Season"] }
  - id: team_game
    label: Team games
    grain: one row per team per game
    table: fact_team_game
    modes: [total, per_game, per_100]
  - id: shots
    label: Shots
    grain: one row per shot attempt
    table: fact_shot
    modes: [total]
  - id: player_season
    label: Player seasons
    grain: one row per player per season, with NBA.com's season-only tracking, defended shots and hustle
    table: fact_player_season
    games: gp
    modes: [total, per_game, per_36]
  - id: lineups
    label: Lineups
    grain: one row per 2-man or 5-man lineup per team per season
    table: fact_lineup
    games: gp
    modes: [total, per_game, per_36, per_100]
  - id: play_types
    label: Play types
    grain: one row per player, season, play type and side (offense or defense)
    table: fact_play_type
    modes: [total, per_100]
  - id: matchups
    label: Matchups
    grain: one row per defender, per player guarded, per game
    table: fact_matchup
    modes: [total]

groups: [Player, Team, Game, Context, Shot, Box score, Shooting, Shot zones, Advanced, Scoring, Hustle, Tracking, Defense, Opponent, Clutch, Lineup, Play type, Drives, Catch & shoot, Pull-ups, Touches, Passing, Rebounding, Defended shots, Matchup]

fields:
  # ── Player ────────────────────────────────────────────────────────────────
  - id: player
    label: Player
    short: Player
    group: Player
    kind: dimension
    type: text
    key: player_id
    expr: player_name
    source: gamelog
    description: The player. Grouped by player id, shown by name.

  - id: position
    label: Position
    short: Pos
    group: Player
    kind: dimension
    type: text
    expr: position
    source: bio
    description: Listed position that season (G, F, C, G-F, F-C).

  - id: age_bucket
    label: Age
    short: Age
    group: Player
    kind: dimension
    type: bucket
    bins: ["≤21", "22-24", "25-27", "28-30", "31-33", "34+"]
    expr: >-
      CASE WHEN age IS NULL THEN NULL
           WHEN age < 22 THEN '≤21'
           WHEN age < 25 THEN '22-24'
           WHEN age < 28 THEN '25-27'
           WHEN age < 31 THEN '28-30'
           WHEN age < 34 THEN '31-33'
           ELSE '34+' END
    source: bio
    description: Age that season, from NBA.com's player bio stats.

  - id: draft_round
    label: Draft round
    short: Draft rd
    group: Player
    kind: dimension
    type: bucket
    expr: "CASE WHEN draft_round = 1 THEN '1st round' WHEN draft_round = 2 THEN '2nd round' ELSE 'Undrafted' END"
    bins: [1st round, 2nd round, Undrafted]
    source: bio
    description: Round drafted in, or Undrafted.

  - id: is_starter
    label: Starter / bench
    short: Role
    group: Player
    kind: dimension
    type: bucket
    bins: [Starter, Bench]
    expr: "CASE WHEN is_starter THEN 'Starter' ELSE 'Bench' END"
    source: box_v3
    datasets: [player_game]
    description: Whether the player started the game (from the box score).

  # ── Team ──────────────────────────────────────────────────────────────────
  - id: team
    label: Team
    short: Team
    group: Team
    kind: dimension
    type: text
    key: team_id
    expr: team_abbreviation
    source: gamelog
    description: The player's team in that game (so traded players split correctly).

  - id: opponent
    label: Opponent
    short: Opp
    group: Team
    kind: dimension
    type: text
    key: opp_team_id
    expr: opp_abbreviation
    source: derived
    description: The team they played against.

  - id: conference
    label: Conference
    short: Conf
    group: Team
    kind: dimension
    type: text
    expr: conference
    source: team_info
    description: East or West (the player's team).

  - id: opp_conference
    label: Opponent conference
    short: Opp conf
    group: Team
    kind: dimension
    type: text
    expr: opp_conference
    source: team_info
    description: Whether the opponent is East or West.

  # ── Game ──────────────────────────────────────────────────────────────────
  - id: season
    label: Season
    short: Season
    group: Game
    kind: dimension
    type: text
    expr: season
    source: gamelog
    description: Season label, e.g. 2025-26.

  - id: season_type
    label: Season type
    short: Type
    group: Game
    kind: dimension
    type: text
    bins: [Regular Season, Play-In, Playoffs]
    expr: season_type
    source: gamelog
    description: Regular season, play-in or playoffs.

  - id: game_date
    label: Game date
    short: Date
    group: Game
    kind: dimension
    type: date
    expr: game_date
    source: gamelog
    description: Local date of the game.

  - id: month
    label: Month
    short: Month
    group: Game
    kind: dimension
    type: bucket
    bins: [Oct, Nov, Dec, Jan, Feb, Mar, Apr, May, Jun]
    expr: "strftime(game_date, '%b')"
    source: derived
    description: Calendar month of the game.

  - id: weekday
    label: Day of week
    short: Day
    group: Game
    kind: dimension
    type: bucket
    bins: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
    expr: "strftime(game_date, '%a')"
    source: derived
    description: Day of the week the game was played.

  - id: all_star_split
    label: Before / after All-Star break
    short: ASB
    group: Game
    kind: dimension
    type: bucket
    bins: [Pre All-Star, Post All-Star]
    expr: "CASE WHEN is_post_all_star THEN 'Post All-Star' ELSE 'Pre All-Star' END"
    source: schedule
    description: Whether the game was after that season's All-Star game.

  - id: game_number_bucket
    label: Team game number
    short: Game #
    group: Game
    kind: dimension
    type: bucket
    bins: ["1-20", "21-41", "42-61", "62-82", "Playoffs"]
    expr: >-
      CASE WHEN season_type <> 'Regular Season' THEN 'Playoffs'
           WHEN game_number <= 20 THEN '1-20'
           WHEN game_number <= 41 THEN '21-41'
           WHEN game_number <= 61 THEN '42-61'
           ELSE '62-82' END
    source: derived
    description: Where in the team's season the game fell.

  # ── Context ───────────────────────────────────────────────────────────────
  - id: venue
    label: Home / away
    short: H/A
    group: Context
    kind: dimension
    type: bucket
    bins: [Home, Away]
    expr: "CASE WHEN is_home THEN 'Home' ELSE 'Away' END"
    source: derived
    description: From the matchup text ('vs.' = home, '@' = away).

  - id: result
    label: Win / loss
    short: W/L
    group: Context
    kind: dimension
    type: bucket
    bins: [W, L]
    expr: "CASE WHEN is_win THEN 'W' ELSE 'L' END"
    source: gamelog
    description: Whether the player's team won.

  - id: margin_bucket
    label: Final margin
    short: Margin
    group: Context
    kind: dimension
    type: bucket
    bins: ["Lost 15+", "Lost 6-14", "Within 5", "Won 6-14", "Won 15+"]
    expr: >-
      CASE WHEN margin <= -15 THEN 'Lost 15+'
           WHEN margin <= -6  THEN 'Lost 6-14'
           WHEN margin <= 5   THEN 'Within 5'
           WHEN margin <= 14  THEN 'Won 6-14'
           ELSE 'Won 15+' END
    source: derived
    description: Team's final point margin. A rough stand-in for close games until play-by-play clutch data exists.

  - id: rest_days
    label: Days of rest
    short: Rest
    group: Context
    kind: dimension
    type: bucket
    bins: ["0 (B2B)", "1", "2", "3+"]
    expr: >-
      CASE WHEN rest_days IS NULL OR rest_days >= 3 THEN '3+'
           WHEN rest_days = 0 THEN '0 (B2B)'
           ELSE cast(rest_days AS VARCHAR) END
    source: derived
    description: Days off for the player's team since its previous game. First game of the season counts as 3+.

  - id: opp_strength
    label: Opponent record before game
    short: Opp W%
    group: Context
    kind: dimension
    type: bucket
    bins: ["Under .400", ".400-.549", ".550+"]
    expr: >-
      CASE WHEN opp_win_pct_before < 0.400 THEN 'Under .400'
           WHEN opp_win_pct_before < 0.550 THEN '.400-.549'
           ELSE '.550+' END
    source: derived
    description: Opponent's win % going into the game (not end of season, to avoid hindsight).

  - id: minutes_bucket
    label: Minutes played
    short: Min range
    group: Context
    kind: dimension
    type: bucket
    bins: ["<10", "10-19", "20-29", "30-35", "36+"]
    expr: >-
      CASE WHEN min < 10 THEN '<10' WHEN min < 20 THEN '10-19'
           WHEN min < 30 THEN '20-29' WHEN min < 36 THEN '30-35' ELSE '36+' END
    source: gamelog
    description: Minutes in that game. Also handy as a filter (e.g. 20+ minutes).

  # ── Box score (summable) ──────────────────────────────────────────────────
  - id: games
    label: Games played
    short: GP
    group: Box score
    kind: measure
    agg: count
    expr: "count(*)"
    modes: [total]
    format: "d"
    higher_is_better: true
    datasets: [player_game, team_game, player_season, lineups]
    source: gamelog
    description: Number of games in the group.

  - { id: min,  label: Minutes,            short: MIN, group: Box score, kind: measure, agg: sum, expr: min,  modes: [per_game, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Minutes played. }
  - { id: pts,  label: Points,             short: PTS, group: Box score, kind: measure, agg: sum, expr: pts,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Points scored. }
  - { id: reb,  label: Rebounds,           short: REB, group: Box score, kind: measure, agg: sum, expr: reb,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Total rebounds. }
  - { id: oreb, label: Offensive rebounds, short: OREB, group: Box score, kind: measure, agg: sum, expr: oreb, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Offensive rebounds. }
  - { id: dreb, label: Defensive rebounds, short: DREB, group: Box score, kind: measure, agg: sum, expr: dreb, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Defensive rebounds. }
  - { id: ast,  label: Assists,            short: AST, group: Box score, kind: measure, agg: sum, expr: ast,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Assists. }
  - { id: stl,  label: Steals,             short: STL, group: Box score, kind: measure, agg: sum, expr: stl,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Steals. }
  - { id: blk,  label: Blocks,             short: BLK, group: Box score, kind: measure, agg: sum, expr: blk,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true,  source: gamelog, description: Blocks. }
  - { id: tov,  label: Turnovers,          short: TOV, group: Box score, kind: measure, agg: sum, expr: tov,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: false, source: gamelog, description: Turnovers. }
  - { id: pf,   label: Personal fouls,     short: PF,  group: Box score, kind: measure, agg: sum, expr: pf,   modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: false, source: gamelog, description: Personal fouls. }
  - { id: plus_minus, label: Plus-minus,   short: "+/-", group: Box score, kind: measure, agg: sum, expr: plus_minus, modes: [per_game, total], default_mode: per_game, format: "+.1f", higher_is_better: true, source: gamelog, description: Team point margin while the player was on the floor. }

  - id: double_doubles
    label: Double-doubles
    short: DD
    group: Box score
    kind: measure
    agg: sum
    expr: >-
      cast((pts >= 10)::INT + (reb >= 10)::INT + (ast >= 10)::INT
           + (stl >= 10)::INT + (blk >= 10)::INT >= 2 AS INT)
    modes: [total]
    format: "d"
    higher_is_better: true
    datasets: [player_game]
    source: gamelog
    description: Games with 10+ in at least two of points, rebounds, assists, steals, blocks.

  - id: triple_doubles
    label: Triple-doubles
    short: TD
    group: Box score
    kind: measure
    agg: sum
    expr: >-
      cast((pts >= 10)::INT + (reb >= 10)::INT + (ast >= 10)::INT
           + (stl >= 10)::INT + (blk >= 10)::INT >= 3 AS INT)
    modes: [total]
    format: "d"
    higher_is_better: true
    datasets: [player_game]
    source: gamelog
    description: Games with 10+ in at least three of points, rebounds, assists, steals, blocks.

  - id: game_score
    label: Game Score
    short: GmSc
    group: Box score
    kind: measure
    agg: sum
    expr: >-
      pts + 0.4 * fgm - 0.7 * fga - 0.4 * (fta - ftm) + 0.7 * oreb + 0.3 * dreb
      + stl + 0.7 * ast + 0.7 * blk - 0.4 * pf - tov
    modes: [per_game, total]
    default_mode: per_game
    format: ".1f"
    higher_is_better: true
    datasets: [player_game]
    source: gamelog
    description: John Hollinger's single-game productivity score. Roughly 10 is average, 40 is outstanding.

  # ── Shooting (makes/attempts are summable; % are ratios) ──────────────────
  - { id: fgm,  label: Field goals made,      short: FGM, group: Shooting, kind: measure, agg: sum, expr: fgm,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: gamelog, description: Field goals made. }
  - { id: fga,  label: Field goal attempts,   short: FGA, group: Shooting, kind: measure, agg: sum, expr: fga,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: gamelog, description: Field goals attempted. }
  - { id: fg3m, label: 3-pointers made,       short: 3PM, group: Shooting, kind: measure, agg: sum, expr: fg3m, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: gamelog, description: Three-pointers made. }
  - { id: fg3a, label: 3-point attempts,      short: 3PA, group: Shooting, kind: measure, agg: sum, expr: fg3a, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: gamelog, description: Three-pointers attempted. }
  - { id: ftm,  label: Free throws made,      short: FTM, group: Shooting, kind: measure, agg: sum, expr: ftm,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: gamelog, description: Free throws made. }
  - { id: fta,  label: Free throw attempts,   short: FTA, group: Shooting, kind: measure, agg: sum, expr: fta,  modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: gamelog, description: Free throws attempted. }

  - id: fg_pct
    label: Field goal %
    short: FG%
    group: Shooting
    kind: measure
    agg: ratio
    requires: [fgm, fga]
    formula: "fgm / nullif(fga, 0)"
    format: ".1%"
    higher_is_better: true
    source: gamelog
    description: Field goals made ÷ attempted, over the whole group.

  - id: fg3_pct
    label: 3-point %
    short: 3P%
    group: Shooting
    kind: measure
    agg: ratio
    requires: [fg3m, fg3a]
    formula: "fg3m / nullif(fg3a, 0)"
    format: ".1%"
    higher_is_better: true
    source: gamelog
    description: Threes made ÷ attempted.

  - id: ft_pct
    label: Free throw %
    short: FT%
    group: Shooting
    kind: measure
    agg: ratio
    requires: [ftm, fta]
    formula: "ftm / nullif(fta, 0)"
    format: ".1%"
    higher_is_better: true
    source: gamelog
    description: Free throws made ÷ attempted.

  - id: efg_pct
    label: Effective FG %
    short: eFG%
    group: Shooting
    kind: measure
    agg: ratio
    requires: [fgm, fg3m, fga]
    formula: "(fgm + 0.5 * fg3m) / nullif(fga, 0)"
    format: ".1%"
    higher_is_better: true
    source: gamelog
    description: FG% with threes counted as 1.5 makes.

  - id: ts_pct
    label: True shooting %
    short: TS%
    group: Shooting
    kind: measure
    agg: ratio
    requires: [pts, fga, fta]
    formula: "pts / nullif(2 * (fga + 0.44 * fta), 0)"
    format: ".1%"
    higher_is_better: true
    source: gamelog
    description: Scoring efficiency including threes and free throws.

  - id: fg3a_rate
    label: 3-point attempt rate
    short: 3PAr
    group: Shooting
    kind: measure
    agg: ratio
    requires: [fg3a, fga]
    formula: "fg3a / nullif(fga, 0)"
    format: ".1%"
    source: gamelog
    description: Share of shots that are threes.

  - id: ft_rate
    label: Free throw rate
    short: FTr
    group: Shooting
    kind: measure
    agg: ratio
    requires: [fta, fga]
    formula: "fta / nullif(fga, 0)"
    format: ".3f"
    higher_is_better: true
    source: gamelog
    description: Free throw attempts per field goal attempt.

  - id: ast_tov
    label: Assist-to-turnover ratio
    short: AST/TO
    group: Shooting
    kind: measure
    agg: ratio
    requires: [ast, tov]
    formula: "ast / nullif(tov, 0)"
    format: ".2f"
    higher_is_better: true
    source: gamelog
    description: Assists per turnover.


  - { id: tov_pct, label: Turnover %, short: TOV%, group: Shooting, kind: measure, agg: ratio, requires: [tov, fga, fta], formula: "tov / nullif(fga + 0.44 * fta + tov, 0)", format: ".1%", higher_is_better: false, source: gamelog, description: Turnovers per play (shots + free throw trips + turnovers). }
  - { id: pts_per_shot, label: Points per shot, short: PTS/FGA, group: Shooting, kind: measure, agg: ratio, requires: [pts, fga], formula: "pts / nullif(fga, 0)", format: ".2f", higher_is_better: true, source: gamelog, description: Points scored per field goal attempt (free throws count toward points outside the Shots dataset). }

  # ── More player info (from season bio stats and the player index) ─────────
  - { id: height_bucket, label: Height, short: Ht, group: Player, kind: dimension, type: bucket, bins: ["Under 6'3", "6'3-6'6", "6'7-6'9", "6'10+"], expr: "CASE WHEN height_in IS NULL THEN NULL WHEN height_in < 75 THEN 'Under 6''3' WHEN height_in < 79 THEN '6''3-6''6' WHEN height_in < 82 THEN '6''7-6''9' ELSE '6''10+' END", source: bio, description: Listed height that season. }
  - { id: draft_pick, label: Draft pick, short: Pick, group: Player, kind: dimension, type: bucket, bins: [Top 3, "4-10", "11-30", 2nd round, Undrafted], expr: "CASE WHEN draft_number IS NULL OR draft_round IS NULL THEN 'Undrafted' WHEN draft_round = 2 THEN '2nd round' WHEN draft_number <= 3 THEN 'Top 3' WHEN draft_number <= 10 THEN '4-10' ELSE '11-30' END", datasets: [player_game, player_season], source: bio, description: Where the player was picked. }
  - { id: draft_year, label: Draft class, short: Draft, group: Player, kind: dimension, type: text, expr: "coalesce(cast(draft_year AS VARCHAR), 'Undrafted')", datasets: [player_game, player_season], source: bio, description: Year the player was drafted. }
  - { id: from_usa, label: USA / international, short: Origin, group: Player, kind: dimension, type: bucket, bins: [USA, International], expr: "CASE WHEN country IS NULL THEN NULL WHEN country = 'USA' THEN 'USA' ELSE 'International' END", datasets: [player_game, player_season], source: bio, description: Whether the player is from the USA. }
  - { id: country, label: Country, short: Country, group: Player, kind: dimension, type: text, expr: country, datasets: [player_game, player_season], source: bio, description: Country the player is from. }
  - { id: college, label: College, short: College, group: Player, kind: dimension, type: text, expr: college, datasets: [player_game, player_season], source: bio, description: Last school or club before the NBA. }

  # ── Shot (Shots dataset) ──────────────────────────────────────────────────
  - { id: shot_zone, label: Shot zone, short: Zone, group: Shot, kind: dimension, type: bucket, bins: [Restricted Area, Paint (non-RA), Mid-Range, Corner 3, Above the Break 3, Backcourt], expr: shot_zone, datasets: [shots], source: shots, description: Where the shot was taken from. }
  - { id: shot_area, label: Side of the floor, short: Side, group: Shot, kind: dimension, type: bucket, bins: [Left Side, Left Side Center, Center, Right Side Center, Right Side, Back Court], expr: shot_area, datasets: [shots], source: shots, description: Left, centre or right. }
  - { id: shot_distance_bucket, label: Shot distance, short: Dist, group: Shot, kind: dimension, type: bucket, bins: ["0-3 ft", "4-9 ft", "10-15 ft", "16-22 ft", "23-26 ft", "27-30 ft", "31+ ft"], expr: "CASE WHEN shot_distance <= 3 THEN '0-3 ft' WHEN shot_distance <= 9 THEN '4-9 ft' WHEN shot_distance <= 15 THEN '10-15 ft' WHEN shot_distance <= 22 THEN '16-22 ft' WHEN shot_distance <= 26 THEN '23-26 ft' WHEN shot_distance <= 30 THEN '27-30 ft' ELSE '31+ ft' END", datasets: [shots], source: shots, description: How far from the basket, in feet. }
  - { id: shot_kind, label: Shot type, short: Type, group: Shot, kind: dimension, type: bucket, bins: [Dunk, Layup, Tip / putback, Hook, Floater, Jump shot], expr: shot_kind, datasets: [shots], source: shots, description: Dunk, layup, jumper and so on (grouped from NBA.com's action type). }
  - { id: action_type, label: Shot (detailed), short: Action, group: Shot, kind: dimension, type: text, expr: action_type, datasets: [shots], source: shots, description: NBA.com's detailed shot description, e.g. Pullup Jump Shot. }
  - { id: shot_value, label: 2 or 3, short: 2/3, group: Shot, kind: dimension, type: bucket, bins: [2PT, 3PT], expr: "CASE WHEN fg3a = 1 THEN '3PT' ELSE '2PT' END", datasets: [shots], source: shots, description: Two-pointer or three-pointer. }
  - { id: shot_result, label: Made / missed, short: Result, group: Shot, kind: dimension, type: bucket, bins: [Made, Missed], expr: "CASE WHEN fgm = 1 THEN 'Made' ELSE 'Missed' END", datasets: [shots], source: shots, description: Whether the shot went in. }
  - { id: period, label: Quarter, short: Qtr, group: Shot, kind: dimension, type: bucket, bins: [Q1, Q2, Q3, Q4, OT], expr: "CASE WHEN period <= 4 THEN 'Q' || period ELSE 'OT' END", datasets: [shots], source: shots, description: Quarter the shot was taken in. }
  - { id: clock_bucket, label: Time left in quarter, short: Clock, group: Shot, kind: dimension, type: bucket, bins: ["9-12 min", "6-9 min", "3-6 min", "1-3 min", "Last minute"], expr: "CASE WHEN clock_seconds > 540 THEN '9-12 min' WHEN clock_seconds > 360 THEN '6-9 min' WHEN clock_seconds > 180 THEN '3-6 min' WHEN clock_seconds > 60 THEN '1-3 min' ELSE 'Last minute' END", datasets: [shots], source: shots, description: Game clock when the shot went up. }

  # ── Shot zones (player and team games, from the shot chart) ──────────────
  - { id: charted_fga, label: Charted shots, short: Charted, group: Shot zones, kind: measure, agg: sum, expr: charted_fga, hidden: true, format: ".0f", source: shots, description: Shots on the shot chart. }
  - { id: shot_distance_sum, label: Total shot distance, short: Dist sum, group: Shot zones, kind: measure, agg: sum, expr: shot_distance_sum, hidden: true, format: ".0f", source: shots, description: Building block for average shot distance. }
  - { id: avg_shot_distance, label: Average shot distance, short: Avg dist, group: Shot zones, kind: measure, agg: ratio, requires: [shot_distance_sum, charted_fga], formula: "shot_distance_sum / nullif(charted_fga, 0)", format: ".1f", source: shots, description: Average distance of field goal attempts, in feet. }
  - { id: ra_fgm, label: "Restricted area makes", short: "RA FGM", group: Shot zones, kind: measure, agg: sum, expr: ra_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_game, team_game], source: shots, description: "Shots made at the rim (restricted area)." }
  - { id: ra_fga, label: "Restricted area attempts", short: "RA FGA", group: Shot zones, kind: measure, agg: sum, expr: ra_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", datasets: [player_game, team_game], source: shots, description: "Shots taken at the rim (restricted area)." }
  - { id: ra_pct, label: "Restricted area FG%", short: "RA FG%", group: Shot zones, kind: measure, agg: ratio, requires: [ra_fgm, ra_fga], formula: "ra_fgm / nullif(ra_fga, 0)", format: ".1%", higher_is_better: true, source: shots, description: "Shooting percentage at the rim (restricted area)." }
  - { id: ra_share, label: "Restricted area share of shots", short: "RA %FGA", group: Shot zones, kind: measure, agg: ratio, requires: [ra_fga, charted_fga], formula: "ra_fga / nullif(charted_fga, 0)", format: ".1%", source: shots, description: "Share of all shots taken at the rim (restricted area)." }
  - { id: paint_fgm, label: "Paint (non-RA) makes", short: "Paint FGM", group: Shot zones, kind: measure, agg: sum, expr: paint_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_game, team_game], source: shots, description: "Shots made in the paint outside the restricted area." }
  - { id: paint_fga, label: "Paint (non-RA) attempts", short: "Paint FGA", group: Shot zones, kind: measure, agg: sum, expr: paint_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", datasets: [player_game, team_game], source: shots, description: "Shots taken in the paint outside the restricted area." }
  - { id: paint_pct, label: "Paint (non-RA) FG%", short: "Paint FG%", group: Shot zones, kind: measure, agg: ratio, requires: [paint_fgm, paint_fga], formula: "paint_fgm / nullif(paint_fga, 0)", format: ".1%", higher_is_better: true, source: shots, description: "Shooting percentage in the paint outside the restricted area." }
  - { id: paint_share, label: "Paint (non-RA) share of shots", short: "Paint %FGA", group: Shot zones, kind: measure, agg: ratio, requires: [paint_fga, charted_fga], formula: "paint_fga / nullif(charted_fga, 0)", format: ".1%", source: shots, description: "Share of all shots taken in the paint outside the restricted area." }
  - { id: mid_fgm, label: "Mid-range makes", short: "Mid FGM", group: Shot zones, kind: measure, agg: sum, expr: mid_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_game, team_game], source: shots, description: "Shots made from mid-range." }
  - { id: mid_fga, label: "Mid-range attempts", short: "Mid FGA", group: Shot zones, kind: measure, agg: sum, expr: mid_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", datasets: [player_game, team_game], source: shots, description: "Shots taken from mid-range." }
  - { id: mid_pct, label: "Mid-range FG%", short: "Mid FG%", group: Shot zones, kind: measure, agg: ratio, requires: [mid_fgm, mid_fga], formula: "mid_fgm / nullif(mid_fga, 0)", format: ".1%", higher_is_better: true, source: shots, description: "Shooting percentage from mid-range." }
  - { id: mid_share, label: "Mid-range share of shots", short: "Mid %FGA", group: Shot zones, kind: measure, agg: ratio, requires: [mid_fga, charted_fga], formula: "mid_fga / nullif(charted_fga, 0)", format: ".1%", source: shots, description: "Share of all shots taken from mid-range." }
  - { id: corner3_fgm, label: "Corner 3 makes", short: "C3 FGM", group: Shot zones, kind: measure, agg: sum, expr: corner3_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_game, team_game], source: shots, description: "Shots made from the corners." }
  - { id: corner3_fga, label: "Corner 3 attempts", short: "C3 FGA", group: Shot zones, kind: measure, agg: sum, expr: corner3_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", datasets: [player_game, team_game], source: shots, description: "Shots taken from the corners." }
  - { id: corner3_pct, label: "Corner 3 FG%", short: "C3 FG%", group: Shot zones, kind: measure, agg: ratio, requires: [corner3_fgm, corner3_fga], formula: "corner3_fgm / nullif(corner3_fga, 0)", format: ".1%", higher_is_better: true, source: shots, description: "Shooting percentage from the corners." }
  - { id: corner3_share, label: "Corner 3 share of shots", short: "C3 %FGA", group: Shot zones, kind: measure, agg: ratio, requires: [corner3_fga, charted_fga], formula: "corner3_fga / nullif(charted_fga, 0)", format: ".1%", source: shots, description: "Share of all shots taken from the corners." }
  - { id: ab3_fgm, label: "Above-the-break 3 makes", short: "AB3 FGM", group: Shot zones, kind: measure, agg: sum, expr: ab3_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_game, team_game], source: shots, description: "Shots made from above the break." }
  - { id: ab3_fga, label: "Above-the-break 3 attempts", short: "AB3 FGA", group: Shot zones, kind: measure, agg: sum, expr: ab3_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", datasets: [player_game, team_game], source: shots, description: "Shots taken from above the break." }
  - { id: ab3_pct, label: "Above-the-break 3 FG%", short: "AB3 FG%", group: Shot zones, kind: measure, agg: ratio, requires: [ab3_fgm, ab3_fga], formula: "ab3_fgm / nullif(ab3_fga, 0)", format: ".1%", higher_is_better: true, source: shots, description: "Shooting percentage from above the break." }
  - { id: ab3_share, label: "Above-the-break 3 share of shots", short: "AB3 %FGA", group: Shot zones, kind: measure, agg: ratio, requires: [ab3_fga, charted_fga], formula: "ab3_fga / nullif(charted_fga, 0)", format: ".1%", source: shots, description: "Share of all shots taken from above the break." }
  - { id: dunk_fgm, label: "Dunk makes", short: "Dunk FGM", group: Shot zones, kind: measure, agg: sum, expr: dunk_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_game, team_game], source: shots, description: "Shots made on dunks." }
  - { id: dunk_fga, label: "Dunk attempts", short: "Dunk FGA", group: Shot zones, kind: measure, agg: sum, expr: dunk_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", datasets: [player_game, team_game], source: shots, description: "Shots taken on dunks." }
  - { id: dunk_pct, label: "Dunk FG%", short: "Dunk FG%", group: Shot zones, kind: measure, agg: ratio, requires: [dunk_fgm, dunk_fga], formula: "dunk_fgm / nullif(dunk_fga, 0)", format: ".1%", higher_is_better: true, source: shots, description: "Shooting percentage on dunks." }
  - { id: dunk_share, label: "Dunk share of shots", short: "Dunk %FGA", group: Shot zones, kind: measure, agg: ratio, requires: [dunk_fga, charted_fga], formula: "dunk_fga / nullif(charted_fga, 0)", format: ".1%", source: shots, description: "Share of all shots taken on dunks." }

  # ── Advanced (per-game rates from the V3 box scores) ──────────────────────
  # These arrive as per-game rates, so they're averaged, weighted by possessions
  # (ratings) or minutes (the rest). For ratings that's exact: rating × possessions = points × 100.
  - { id: poss, label: Possessions, short: POSS, group: Advanced, kind: measure, agg: sum, expr: poss, modes: [per_game, total], default_mode: per_game, format: ".1f", source: box_v3, description: Possessions played (the player's while on the floor; the team's for team games). }
  - { id: off_rtg, label: Offensive rating, short: ORTG, group: Advanced, kind: measure, agg: weighted_avg, expr: off_rtg, weight: poss, format: ".1f", higher_is_better: true, source: box_v3, description: Team points per 100 possessions (with the player on the floor, for player games). }
  - { id: def_rtg, label: Defensive rating, short: DRTG, group: Advanced, kind: measure, agg: weighted_avg, expr: def_rtg, weight: poss, format: ".1f", higher_is_better: false, source: box_v3, description: Opponent points per 100 possessions. }
  - { id: net_rtg, label: Net rating, short: NET, group: Advanced, kind: measure, agg: weighted_avg, expr: net_rtg, weight: poss, format: "+.1f", higher_is_better: true, source: box_v3, description: Offensive minus defensive rating. }
  - { id: pace, label: Pace, short: PACE, group: Advanced, kind: measure, agg: weighted_avg, expr: pace, weight: min, format: ".1f", source: box_v3, description: Possessions per 48 minutes. }
  - { id: pie, label: PIE, short: PIE, group: Advanced, kind: measure, agg: weighted_avg, expr: pie, weight: min, format: ".1%", higher_is_better: true, source: box_v3, description: NBA.com Player Impact Estimate, the share of game events the player (or team) was part of. }
  - { id: usg_pct, label: Usage %, short: USG%, group: Advanced, kind: measure, agg: weighted_avg, expr: usg_pct, weight: min, format: ".1%", datasets: [player_game], source: box_v3, description: Share of team plays used by the player while on the floor. }
  - { id: ast_pct, label: Assist %, short: AST%, group: Advanced, kind: measure, agg: weighted_avg, expr: ast_pct, weight: min, format: ".1%", higher_is_better: true, datasets: [player_game, lineups], source: box_v3, description: Share of teammate baskets the player assisted while on the floor. }
  - { id: ast_ratio, label: Assist ratio, short: AST RAT, group: Advanced, kind: measure, agg: weighted_avg, expr: ast_ratio, weight: min, format: ".1f", higher_is_better: true, datasets: [player_game], source: box_v3, description: Assists per 100 of the player's possessions. }
  - { id: tov_ratio, label: Turnover ratio, short: TO RAT, group: Advanced, kind: measure, agg: weighted_avg, expr: tov_ratio, weight: min, format: ".1f", higher_is_better: false, datasets: [player_game], source: box_v3, description: Turnovers per 100 of the player's possessions. }
  - { id: oreb_pct, label: Offensive rebound %, short: OREB%, group: Advanced, kind: measure, agg: weighted_avg, expr: oreb_pct, weight: min, format: ".1%", higher_is_better: true, datasets: [player_game, lineups], source: box_v3, description: Share of available offensive rebounds grabbed while on the floor. }
  - { id: dreb_pct, label: Defensive rebound %, short: DREB%, group: Advanced, kind: measure, agg: weighted_avg, expr: dreb_pct, weight: min, format: ".1%", higher_is_better: true, datasets: [player_game, lineups], source: box_v3, description: Share of available defensive rebounds grabbed while on the floor. }
  - { id: reb_pct, label: Rebound %, short: REB%, group: Advanced, kind: measure, agg: weighted_avg, expr: reb_pct, weight: min, format: ".1%", higher_is_better: true, datasets: [player_game, lineups], source: box_v3, description: Share of available rebounds grabbed while on the floor. }

  # ── Scoring breakdown ─────────────────────────────────────────────────────
  - { id: pts_paint, label: Points in the paint, short: PITP, group: Scoring, kind: measure, agg: sum, expr: pts_paint, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: box_v3, description: Points scored in the paint. }
  - { id: pts_fast_break, label: Fast break points, short: FBPS, group: Scoring, kind: measure, agg: sum, expr: pts_fast_break, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: box_v3, description: Points on fast breaks. }
  - { id: pts_2nd_chance, label: Second chance points, short: 2ND PTS, group: Scoring, kind: measure, agg: sum, expr: pts_2nd_chance, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: box_v3, description: Points after an offensive rebound. }
  - { id: pts_off_tov, label: Points off turnovers, short: PTS OFF TO, group: Scoring, kind: measure, agg: sum, expr: pts_off_tov, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: box_v3, description: Points after the other team turned it over. }
  - { id: ast_fgm, label: Assisted makes, short: AST FGM, group: Scoring, kind: measure, agg: sum, expr: ast_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", datasets: [player_game], source: box_v3, description: Made shots that were assisted. }
  - { id: ast_fgm_pct, label: Assisted %, short: "%AST FGM", group: Scoring, kind: measure, agg: ratio, requires: [ast_fgm, fgm], formula: "ast_fgm / nullif(fgm, 0)", format: ".1%", datasets: [player_game], source: box_v3, description: Share of made shots that were assisted. }
  - { id: fouls_drawn, label: Fouls drawn, short: PFD, group: Scoring, kind: measure, agg: sum, expr: fouls_drawn, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: box_v3, description: Personal fouls drawn. }
  - { id: blk_against, label: Shots blocked, short: BLKA, group: Scoring, kind: measure, agg: sum, expr: blk_against, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: false, source: box_v3, description: Times the player's (or team's) shot was blocked. }

  # ── Hustle ────────────────────────────────────────────────────────────────
  - { id: deflections, label: Deflections, short: DEFL, group: Hustle, kind: measure, agg: sum, expr: deflections, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Passes or dribbles tipped away. }
  - { id: contested_shots, label: Contested shots, short: CONT, group: Hustle, kind: measure, agg: sum, expr: contested_shots, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Opponent shots contested. }
  - { id: contested_2pt, label: Contested 2s, short: CONT 2, group: Hustle, kind: measure, agg: sum, expr: contested_2pt, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Opponent two-pointers contested. }
  - { id: contested_3pt, label: Contested 3s, short: CONT 3, group: Hustle, kind: measure, agg: sum, expr: contested_3pt, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Opponent three-pointers contested. }
  - { id: charges_drawn, label: Charges drawn, short: CHG, group: Hustle, kind: measure, agg: sum, expr: charges_drawn, modes: [per_game, per_36, per_100, total], default_mode: total, format: ".1f", higher_is_better: true, source: hustle, description: Offensive fouls drawn by taking a charge. }
  - { id: screen_ast, label: Screen assists, short: SCR AST, group: Hustle, kind: measure, agg: sum, expr: screen_ast, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Screens that led straight to a made basket. }
  - { id: screen_ast_pts, label: Screen assist points, short: SCR PTS, group: Hustle, kind: measure, agg: sum, expr: screen_ast_pts, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Points from those baskets. }
  - { id: loose_balls, label: Loose balls recovered, short: LBR, group: Hustle, kind: measure, agg: sum, expr: loose_balls, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Loose balls recovered. }
  - { id: box_outs, label: Box outs, short: BOX, group: Hustle, kind: measure, agg: sum, expr: box_outs, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: hustle, description: Box outs on shots. }

  # ── Tracking (player-tracking cameras) ────────────────────────────────────
  - { id: distance, label: Distance run, short: DIST, group: Tracking, kind: measure, agg: sum, expr: distance, modes: [per_game, per_36, total], default_mode: per_game, format: ".2f", source: tracking, description: Miles covered. }
  - { id: speed, label: Average speed, short: SPD, group: Tracking, kind: measure, agg: weighted_avg, expr: speed, weight: min, format: ".2f", datasets: [player_game, player_season], source: tracking, description: Average speed in miles per hour while on the floor. }
  - { id: touches, label: Touches, short: TCH, group: Tracking, kind: measure, agg: sum, expr: touches, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Times the player (or team) had the ball. }
  - { id: passes, label: Passes, short: PASS, group: Tracking, kind: measure, agg: sum, expr: passes, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Passes made. }
  - { id: secondary_ast, label: Secondary assists, short: 2ND AST, group: Tracking, kind: measure, agg: sum, expr: secondary_ast, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: tracking, description: The pass before the assist. }
  - { id: ft_ast, label: Free throw assists, short: FT AST, group: Tracking, kind: measure, agg: sum, expr: ft_ast, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: true, source: tracking, description: Passes that led to a shooting foul and free throws. }
  - { id: reb_chances, label: Rebound chances, short: REB CH, group: Tracking, kind: measure, agg: sum, expr: reb_chances, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Times the player was near a rebound. }
  - { id: reb_chance_pct, label: Rebound chance %, short: REB CH%, group: Tracking, kind: measure, agg: ratio, requires: [reb, reb_chances], formula: "reb / nullif(reb_chances, 0)", format: ".1%", higher_is_better: true, source: tracking, description: Rebounds grabbed out of rebound chances. }
  - { id: pts_per_touch, label: Points per touch, short: PTS/TCH, group: Tracking, kind: measure, agg: ratio, requires: [pts, touches], formula: "pts / nullif(touches, 0)", format: ".3f", higher_is_better: true, source: tracking, description: Points scored per touch of the ball. }
  - { id: contested_fgm, label: Contested makes, short: CFGM, group: Tracking, kind: measure, agg: sum, expr: contested_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Made shots with a defender close. }
  - { id: contested_fga, label: Contested attempts, short: CFGA, group: Tracking, kind: measure, agg: sum, expr: contested_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Shots taken with a defender close. }
  - { id: contested_fg_pct, label: Contested FG%, short: CFG%, group: Tracking, kind: measure, agg: ratio, requires: [contested_fgm, contested_fga], formula: "contested_fgm / nullif(contested_fga, 0)", format: ".1%", higher_is_better: true, source: tracking, description: Shooting with a defender close. }
  - { id: uncontested_fgm, label: Open makes, short: UFGM, group: Tracking, kind: measure, agg: sum, expr: uncontested_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Made shots without a defender close. }
  - { id: uncontested_fga, label: Open attempts, short: UFGA, group: Tracking, kind: measure, agg: sum, expr: uncontested_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Shots taken without a defender close. }
  - { id: uncontested_fg_pct, label: Open FG%, short: UFG%, group: Tracking, kind: measure, agg: ratio, requires: [uncontested_fgm, uncontested_fga], formula: "uncontested_fgm / nullif(uncontested_fga, 0)", format: ".1%", higher_is_better: true, source: tracking, description: Shooting without a defender close. }
  - { id: rim_def_fgm, label: Makes allowed at the rim, short: DFGM RIM, group: Tracking, kind: measure, agg: sum, expr: rim_def_fgm, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", higher_is_better: false, source: tracking, description: Opponent makes at the rim with this defender there. }
  - { id: rim_def_fga, label: Shots defended at the rim, short: DFGA RIM, group: Tracking, kind: measure, agg: sum, expr: rim_def_fga, modes: [per_game, per_36, per_100, total], default_mode: per_game, format: ".1f", source: tracking, description: Opponent shots at the rim with this defender there. }
  - { id: rim_def_pct, label: Opponent FG% at the rim, short: DFG% RIM, group: Tracking, kind: measure, agg: ratio, requires: [rim_def_fgm, rim_def_fga], formula: "rim_def_fgm / nullif(rim_def_fga, 0)", format: ".1%", higher_is_better: false, source: tracking, description: How opponents shot at the rim against this defender. }

  # ── Defense (matchup data: the players they guarded) ──────────────────────
  - { id: matchup_min, label: Matchup minutes, short: MATCH MIN, group: Defense, kind: measure, agg: sum, expr: matchup_min, modes: [per_game, total], default_mode: per_game, format: ".1f", datasets: [player_game, matchups], source: box_matchups, description: Minutes spent guarding someone. }
  - { id: matchup_poss, label: Matchup possessions, short: MATCH POSS, group: Defense, kind: measure, agg: sum, expr: matchup_poss, modes: [per_game, total], default_mode: per_game, format: ".1f", datasets: [player_game, matchups], source: box_matchups, description: Possessions spent guarding someone (partial possessions added up). }
