  - { id: passes_received, label: "Passes received", short: "PASS REC", group: "Passing", kind: measure, agg: sum, expr: passes_received, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Passes caught." }
  - { id: potential_ast, label: "Potential assists", short: "POT AST", group: "Passing", kind: measure, agg: sum, expr: potential_ast, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_season], source: season_dash, description: "Passes that led to a shot that would have been an assist if it went in." }
  - { id: ast_pts_created, label: "Assist points created", short: "AST PTS", group: "Passing", kind: measure, agg: sum, expr: ast_pts_created, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", higher_is_better: true, datasets: [player_season], source: season_dash, description: "Points from their assists (3 for an assisted three)." }
  - { id: ast_per_pass, label: "Assists per pass", short: "AST/PASS", group: "Passing", kind: measure, agg: ratio, requires: [ast, passes], formula: "ast / nullif(passes, 0)", format: ".1%", higher_is_better: true, datasets: [player_season], source: season_dash, description: "Share of passes that became assists." }
  - { id: potential_ast_conv, label: "Potential assist conversion", short: "AST/POT", group: "Passing", kind: measure, agg: ratio, requires: [ast, potential_ast], formula: "ast / nullif(potential_ast, 0)", format: ".1%", datasets: [player_season], source: season_dash, description: "Share of potential assists that became real ones (mostly how well teammates shot)." }

  # ── Rebounding (season tracking) ──────────────────────────────────────────
  - { id: oreb_contest, label: "Contested offensive rebounds", short: "C OREB", group: "Rebounding", kind: measure, agg: sum, expr: oreb_contest, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Offensive rebounds grabbed with an opponent within 3.5 ft." }
  - { id: dreb_contest, label: "Contested defensive rebounds", short: "C DREB", group: "Rebounding", kind: measure, agg: sum, expr: dreb_contest, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Defensive rebounds grabbed with an opponent within 3.5 ft." }
  - { id: reb_contest, label: "Contested rebounds", short: "C REB", group: "Rebounding", kind: measure, agg: sum, expr: reb_contest, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Rebounds grabbed with an opponent within 3.5 ft." }
  - { id: oreb_chances, label: "Offensive rebound chances", short: "OREB CH", group: "Rebounding", kind: measure, agg: sum, expr: oreb_chances, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Times they were within 3.5 ft of an offensive rebound." }
  - { id: dreb_chances, label: "Defensive rebound chances", short: "DREB CH", group: "Rebounding", kind: measure, agg: sum, expr: dreb_chances, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Times they were within 3.5 ft of a defensive rebound." }
  - { id: contested_reb_pct, label: "Contested rebound %", short: "C REB%", group: "Rebounding", kind: measure, agg: ratio, requires: [reb_contest, reb], formula: "reb_contest / nullif(reb, 0)", format: ".1%", datasets: [player_season], source: season_dash, description: "Share of their rebounds that were contested." }
  - { id: oreb_chance_pct, label: "Offensive rebound chance %", short: "OREB CH%", group: "Rebounding", kind: measure, agg: ratio, requires: [oreb, oreb_chances], formula: "oreb / nullif(oreb_chances, 0)", format: ".1%", higher_is_better: true, datasets: [player_season], source: season_dash, description: "Offensive rebounds grabbed per chance." }
  - { id: dreb_chance_pct, label: "Defensive rebound chance %", short: "DREB CH%", group: "Rebounding", kind: measure, agg: ratio, requires: [dreb, dreb_chances], formula: "dreb / nullif(dreb_chances, 0)", format: ".1%", higher_is_better: true, datasets: [player_season], source: season_dash, description: "Defensive rebounds grabbed per chance." }

  # ── Speed and distance (season tracking) ──────────────────────────────────
  - { id: dist_miles_off, label: "Distance on offense", short: "DIST OFF", group: "Tracking", kind: measure, agg: sum, expr: dist_miles_off, modes: [per_game, per_36, total], default_mode: per_game, format: ".2f", datasets: [player_season], source: season_dash, description: "Miles covered on offense." }
  - { id: dist_miles_def, label: "Distance on defense", short: "DIST DEF", group: "Tracking", kind: measure, agg: sum, expr: dist_miles_def, modes: [per_game, per_36, total], default_mode: per_game, format: ".2f", datasets: [player_season], source: season_dash, description: "Miles covered on defense." }
  - { id: speed_off, label: "Speed on offense", short: "SPD OFF", group: "Tracking", kind: measure, agg: weighted_avg, expr: avg_speed_off, weight: min, format: ".2f", datasets: [player_season], source: season_dash, description: "Average speed on offense (mph), weighted by minutes." }
  - { id: speed_def, label: "Speed on defense", short: "SPD DEF", group: "Tracking", kind: measure, agg: weighted_avg, expr: avg_speed_def, weight: min, format: ".2f", datasets: [player_season], source: season_dash, description: "Average speed on defense (mph), weighted by minutes." }
  - { id: off_box_outs, label: "Offensive box outs", short: "OFF BOX", group: "Hustle", kind: measure, agg: sum, expr: off_box_outs, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Box outs on offense." }
  - { id: def_box_outs, label: "Defensive box outs", short: "DEF BOX", group: "Hustle", kind: measure, agg: sum, expr: def_box_outs, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Box outs on defense." }

  # ── Defended shots (season tracking: closest defender) ────────────────────
  - { id: d_fgm, label: "Makes allowed (closest defender)", short: "DFGM", group: "Defended shots", kind: measure, agg: sum, expr: d_fgm, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", higher_is_better: false, datasets: [player_season], source: season_dash, description: "Makes on all shots where they were the closest defender." }
  - { id: d_fga, label: "Shots defended (closest defender)", short: "DFGA", group: "Defended shots", kind: measure, agg: sum, expr: d_fga, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Attempts on all shots where they were the closest defender." }
  - { id: d_fgm_expected, label: "Expected makes (all shots)", short: "DF xFGM", group: "Defended shots", kind: measure, agg: sum, expr: d_fgm_expected, modes: [total], format: ".1f", hidden: true, datasets: [player_season], source: season_dash, description: "What those shooters would usually make on all shots." }
  - { id: d_fg_pct, label: "FG% allowed", short: "DFG%", group: "Defended shots", kind: measure, agg: ratio, requires: [d_fgm, d_fga], formula: "d_fgm / nullif(d_fga, 0)", format: ".1%", higher_is_better: false, datasets: [player_season], source: season_dash, description: "How shooters did on all shots with them as the closest defender." }
  - { id: d_fg_pct_diff, label: "FG% vs normal", short: "DFG% +/-", group: "Defended shots", kind: measure, agg: ratio, requires: [d_fgm, d_fgm_expected, d_fga], formula: "(d_fgm - d_fgm_expected) / nullif(d_fga, 0)", format: "+.1%", higher_is_better: false, datasets: [player_season], source: season_dash, description: "FG% allowed on all shots minus what those shooters usually shoot. Negative is good defense." }
  - { id: d_fg3m, label: "3-point makes allowed (closest defender)", short: "DF3GM", group: "Defended shots", kind: measure, agg: sum, expr: d_fg3m, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", higher_is_better: false, datasets: [player_season], source: season_dash, description: "Makes on threes where they were the closest defender." }
  - { id: d_fg3a, label: "3-point shots defended (closest defender)", short: "DF3GA", group: "Defended shots", kind: measure, agg: sum, expr: d_fg3a, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Attempts on threes where they were the closest defender." }
  - { id: d_fg3m_expected, label: "Expected makes (threes)", short: "DF3 xFGM", group: "Defended shots", kind: measure, agg: sum, expr: d_fg3m_expected, modes: [total], format: ".1f", hidden: true, datasets: [player_season], source: season_dash, description: "What those shooters would usually make on threes." }
  - { id: d_fg3_pct, label: "3-point FG% allowed", short: "DF3G%", group: "Defended shots", kind: measure, agg: ratio, requires: [d_fg3m, d_fg3a], formula: "d_fg3m / nullif(d_fg3a, 0)", format: ".1%", higher_is_better: false, datasets: [player_season], source: season_dash, description: "How shooters did on threes with them as the closest defender." }
  - { id: d_fg3_pct_diff, label: "3-point FG% vs normal", short: "DF3G% +/-", group: "Defended shots", kind: measure, agg: ratio, requires: [d_fg3m, d_fg3m_expected, d_fg3a], formula: "(d_fg3m - d_fg3m_expected) / nullif(d_fg3a, 0)", format: "+.1%", higher_is_better: false, datasets: [player_season], source: season_dash, description: "FG% allowed on threes minus what those shooters usually shoot. Negative is good defense." }
  - { id: d_lt6_fgm, label: "Within 6 ft makes allowed (closest defender)", short: "DF6GM", group: "Defended shots", kind: measure, agg: sum, expr: d_lt6_fgm, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", higher_is_better: false, datasets: [player_season], source: season_dash, description: "Makes on shots within 6 ft where they were the closest defender." }
  - { id: d_lt6_fga, label: "Within 6 ft shots defended (closest defender)", short: "DF6GA", group: "Defended shots", kind: measure, agg: sum, expr: d_lt6_fga, modes: [per_game, per_36, total], default_mode: per_game, format: ".1f", datasets: [player_season], source: season_dash, description: "Attempts on shots within 6 ft where they were the closest defender." }
  - { id: d_lt6_fgm_expected, label: "Expected makes (shots within 6 ft)", short: "DF6 xFGM", group: "Defended shots", kind: measure, agg: sum, expr: d_lt6_fgm_expected, modes: [total], format: ".1f", hidden: true, datasets: [player_season], source: season_dash, description: "What those shooters would usually make on shots within 6 ft." }
  - { id: d_lt6_pct, label: "Within 6 ft FG% allowed", short: "DF6G%", group: "Defended shots", kind: measure, agg: ratio, requires: [d_lt6_fgm, d_lt6_fga], formula: "d_lt6_fgm / nullif(d_lt6_fga, 0)", format: ".1%", higher_is_better: false, datasets: [player_season], source: season_dash, description: "How shooters did on shots within 6 ft with them as the closest defender." }
  - { id: d_lt6_pct_diff, label: "Within 6 ft FG% vs normal", short: "DF6G% +/-", group: "Defended shots", kind: measure, agg: ratio, requires: [d_lt6_fgm, d_lt6_fgm_expected, d_lt6_fga], formula: "(d_lt6_fgm - d_lt6_fgm_expected) / nullif(d_lt6_fga, 0)", format: "+.1%", higher_is_better: false, datasets: [player_season], source: season_dash, description: "FG% allowed on shots within 6 ft minus what those shooters usually shoot. Negative is good defense." }

  # ── Matchups (who guarded who) ────────────────────────────────────────────
  - id: attacker
    label: "Player guarded"
    short: "Guarded"
    group: "Matchup"
    kind: dimension
    type: text
    key: attacker_id
    expr: "attacker_name"
    datasets: [matchups]
    source: season_dash
    description: "The offensive player they were guarding."

  - id: attacker_position
    label: "Position guarded"
    short: "Pos guarded"
    group: "Matchup"
    kind: dimension
    type: text
    expr: "attacker_position"
    datasets: [matchups]
    source: season_dash
    description: "Listed position of the player they guarded."

  - id: attacker_height
    label: "Height guarded"
    short: "Ht guarded"
    group: "Matchup"
    kind: dimension
    type: bucket
    expr: "CASE WHEN attacker_height_in IS NULL THEN NULL WHEN attacker_height_in < 75 THEN 'Under 6''3' WHEN attacker_height_in < 79 THEN '6''3-6''6' WHEN attacker_height_in < 82 THEN '6''7-6''9' ELSE '6''10+' END"
    bins: ["Under 6'3", "6'3-6'6", "6'7-6'9", "6'10+"]
    datasets: [matchups]
    source: season_dash
    description: "Height of the player they guarded."

  - { id: matchup_ast, label: "Assists allowed", short: "AST ALW", group: "Defense", kind: measure, agg: sum, expr: matchup_ast, modes: [total], default_mode: total, format: ".1f", higher_is_better: false, datasets: [matchups], source: season_dash, description: "Assists by the players they guarded." }
  - { id: matchup_tov, label: "Turnovers forced", short: "TOV FRC", group: "Defense", kind: measure, agg: sum, expr: matchup_tov, modes: [total], default_mode: total, format: ".1f", higher_is_better: true, datasets: [matchups], source: season_dash, description: "Turnovers by the players they guarded." }
  - { id: matchup_blk, label: "Blocks on matchup", short: "BLK", group: "Defense", kind: measure, agg: sum, expr: matchup_blk, modes: [total], default_mode: total, format: ".1f", higher_is_better: true, datasets: [matchups], source: season_dash, description: "Blocks on the player they guarded." }
  - { id: matchup_ftm, label: "Free throws allowed", short: "FTM ALW", group: "Defense", kind: measure, agg: sum, expr: matchup_ftm, modes: [total], default_mode: total, format: ".1f", higher_is_better: false, datasets: [matchups], source: season_dash, description: "Free throws made by the players they guarded." }
  - { id: matchup_fta, label: "Free throw attempts allowed", short: "FTA ALW", group: "Defense", kind: measure, agg: sum, expr: matchup_fta, modes: [total], default_mode: total, format: ".1f", higher_is_better: false, datasets: [matchups], source: season_dash, description: "Free throws taken by the players they guarded." }
  - { id: matchup_shooting_fouls, label: "Shooting fouls", short: "SF", group: "Defense", kind: measure, agg: sum, expr: matchup_shooting_fouls, modes: [total], default_mode: total, format: ".1f", higher_is_better: false, datasets: [matchups], source: season_dash, description: "Shooting fouls on the players they guarded." }
